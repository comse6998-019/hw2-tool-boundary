[scan]
paths = ["testcode/BenchmarkTest000*.py"]
exclude = []
min_severity = "MEDIUM"
bandit_version = "1.9.4"

[model]
provider = "anthropic"
name = "claude-sonnet-5"

[budget]
max_tokens = 300000
output_allowance = 1024
max_steps = 400

[agent]
kind = "mcp"            # or "codeact"

[mcp]
config = "mcp.json"

[sandbox]
policy = "policy.yaml"
